[project]
name = "exam-automark"
version = "0.1.0"
description = "Grading skills and benchmark tooling for exam automarking"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.70",
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
    "zulip>=0.9",
]

[project.scripts]
exam-benchmark = "benchmark.core.cli:main"
physics-benchmark = "benchmark.physics.cli:main"

[tool.setuptools.packages.find]
include = ["benchmark*"]
exclude = ["Data*", "data*", "tmp*", "tests*"]
